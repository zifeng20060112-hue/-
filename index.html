<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>致陈晓婷 · 范梓峰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(to bottom,#0c0e2a,#000);min-height:100vh;font-family:"Microsoft YaHei",sans-serif;color:#fff;}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite;}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.box{position:relative;z-index:1;padding:60px 20px;text-align:center;max-width:500px;margin:0 auto;}
h1{font-size:clamp(1.8rem,6vw,2.5rem);margin-bottom:30px;text-shadow:0 0 20px rgba(255,100,150,.8);}
.p{font-size:clamp(1rem,3vw,1.2rem);line-height:2;margin-bottom:25px;color:rgba(255,255,255,.9);}
.sign{font-size:1.2rem;color:#ff9eca;margin-top:40px;}
.heart{display:inline-block;color:#ff4757;animation:beat 1s infinite;}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="box">
  <h1>致 陈晓婷 💌</h1>
  <div class="p">
    晓婷：<br><br>
    不知道从什么时候开始，我的目光总会不自觉地追着你。<br>
    和你在一起的每一刻，都像星星落入眼里，温柔又闪亮。<br>
    我想把这份藏了很久的心意，认真地告诉你——<br>
    喜欢你，不是一时兴起，是深思熟虑后的坚定。<br>
    往后的路，能不能让我牵着你的手，一起走下去？
  </div>
  <div class="sign">—— 喜欢你的 范梓峰 <span class="heart">❤</span></div>
</div>
<script>
const s=document.getElementById('stars'),n=200;
for(let i=0;i<n;i++){
  const st=document.createElement('div');
  st.className='star';
  st.style.left=Math.random()*100+'%';
  st.style.top=Math.random()*100+'%';
  st.style.width=st.style.height=(Math.random()*2+1)+'px';
  st.style.animationDelay=Math.random()*3+'s';
  s.appendChild(st);
}
</script>
</body>
</html>
